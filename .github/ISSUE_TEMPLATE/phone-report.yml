name: Phone compatibility report
description: Tell us whether your phone works
title: "[phone] "
labels: ["compatibility"]
body:
  - type: input
    id: phone
    attributes:
      label: Phone model and Android version
      placeholder: Samsung Galaxy A52, Android 13
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and macOS version
      placeholder: MacBook Air M2, macOS 26.1
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works
        - Interface appears but no internet
        - Phone not detected
        - Other
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Output of `tail -50 /var/log/androidtether.log` and `system_profiler SPUSBDataType`
      render: shell
